<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奥奇传说主题插件 - 图标生成器</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 50px;
            text-align: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #4A90E2;
            margin-bottom: 30px;
        }
        canvas {
            border: 2px solid #ddd;
            margin: 20px 0;
            border-radius: 10px;
        }
        button {
            background: linear-gradient(135deg, #4A90E2, #F5A623);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.3s;
        }
        button:hover {
            transform: translateY(-3px);
        }
        .size-option {
            display: inline-block;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 奥奇传说主题插件 - 图标生成器</h1>
        <p>为插件生成不同尺寸的图标</p>
        
        <div class="size-option">
            <h3>16x16</h3>
            <canvas id="icon16" width="16" height="16"></canvas>
            <button onclick="downloadIcon(16)">下载</button>
        </div>
        
        <div class="size-option">
            <h3>48x48</h3>
            <canvas id="icon48" width="48" height="48"></canvas>
            <button onclick="downloadIcon(48)">下载</button>
        </div>
        
        <div class="size-option">
            <h3>128x128</h3>
            <canvas id="icon128" width="128" height="128"></canvas>
            <button onclick="downloadIcon(128)">下载</button>
        </div>
        
        <br><br>
        <button onclick="generateAllIcons()">生成所有图标</button>
    </div>

    <script>
        function drawIcon(size) {
            const canvas = document.getElementById('icon' + size);
            const ctx = canvas.getContext('2d');
            
            // 清空画布
            ctx.clearRect(0, 0, size, size);
            
            // 绘制渐变背景
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // 绘制圆角
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            const radius = size * 0.2;
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();
            
            ctx.globalCompositeOperation = 'source-over';
            
            // 绘制星星图案
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            const centerX = size / 2;
            const centerY = size / 2;
            const starSize = size * 0.4;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                const x = Math.cos(angle) * starSize;
                const y = Math.sin(angle) * starSize;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            
            // 添加文字（仅在大图标上）
            if (size >= 48) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold ' + (size * 0.15) + 'px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('奥奇', centerX, size - size * 0.1);
            }
        }
        
        function downloadIcon(size) {
            const canvas = document.getElementById('icon' + size);
            const link = document.createElement('a');
            link.download = 'icon-' + size + '.png';
            link.href = canvas.toDataURL();
            link.click();
        }
        
        function generateAllIcons() {
            [16, 48, 128].forEach(size => {
                drawIcon(size);
            });
        }
        
        // 页面加载时生成图标
        window.onload = generateAllIcons;
    </script>
</body>
</html>
